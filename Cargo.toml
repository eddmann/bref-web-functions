[package]
name = "bref-web-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
